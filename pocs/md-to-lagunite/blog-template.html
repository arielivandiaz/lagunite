<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} · Lagunite</title>
  {{DESCRIPTION_META}}
  <link rel="stylesheet" href="{{CSS_HREF}}" />
</head>
<body class="bg">
  <!--
    Generated by pocs/md-to-lagunite/convert-to-html
    Base shell: blog-template.html — markdown fills the article body only.
  -->

  <header class="border-b border-light">
    <div class="container padd-v-s row jc-sb ai-c gap-s">
      <a class="font-s bold color-text" href="{{HOME_HREF}}">Lagunite</a>
      <div class="row ai-c gap">
        <p class="font-xs text-muted marg-0">Blog</p>
        <div class="row ai-c gap-xs" role="group" aria-label="Tema claro u oscuro">
          <span class="color-text" aria-hidden="true" title="Claro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </span>
          <input type="checkbox" class="toggle" id="theme-toggle" />
          <label for="theme-toggle" class="toggle-btn size-s">
            <span class="sr-only">Activar modo noche</span>
          </label>
          <span class="color-text" aria-hidden="true" title="Noche">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" />
            </svg>
          </span>
        </div>
      </div>
    </div>
  </header>

  <main class="padd-v-l">
    <article class="container-prose col gap">
      <header class="col gap-s">
        <p class="font-xs text-muted marg-0">{{DATE}}</p>
        <h1 class="font-xl bold color-text marg-0">{{TITLE}}</h1>
        {{LEAD}}
      </header>

      <div class="col gap">
{{CONTENT}}
      </div>
    </article>
  </main>

  <footer class="padd-v border-t border-light">
    <div class="container-prose">
      <p class="font-xs text-muted marg-0">Generated from markdown · Lagunite CSS</p>
    </div>
  </footer>

  <script>
    (function () {
      const toggle = document.getElementById('theme-toggle');
      if (!toggle) return;
      const sync = () => {
        document.body.classList.toggle('night', toggle.checked);
      };
      toggle.addEventListener('change', sync);
      sync();
    })();
  </script>
</body>
</html>
