<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contrast Grid — Lagunite</title>
  <link rel="stylesheet" href="../dist/lagunite.css" />
  <style>
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 40px;
    }
    .swatch {
      border-radius: var(--radius-m);
      padding: 14px 16px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid rgba(128,128,128,0.15);
    }
    .swatch-name {
      font-family: var(--font-mono, monospace);
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.55;
    }
    .text-sample {
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
    }
    .text-sample .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .contrast-badge {
      font-family: monospace;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      min-width: 44px;
      text-align: center;
    }
    .badge-aaa  { background: #14532d; color: #86efac; }
    .badge-aa   { background: #1e3a5f; color: #93c5fd; }
    .badge-aa18 { background: #3b1f00; color: #fbbf24; }
    .badge-fail { background: #450a0a; color: #fca5a5; }
    .badge-skip { background: #1f1f1f; color: #555; }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      margin: 32px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    .palette-strip {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .palette-swatch {
      flex: 1;
      min-width: 60px;
      height: 72px;
      border-radius: var(--radius-s);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: monospace;
      font-size: 0.6rem;
      font-weight: 700;
      border: 1px solid rgba(128,128,128,0.1);
    }
    .palette-swatch .step-label { opacity: 0.55; font-size: 0.58rem; }
    .palette-swatch .ratio-wh,
    .palette-swatch .ratio-bk { font-size: 0.6rem; }

    .mode-toggle {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(128,128,128,0.2);
      backdrop-filter: blur(8px);
    }
    .toggle-btn {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid rgba(128,128,128,0.3);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.7rem;
      margin-bottom: 24px;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body class="bg">

<!-- STICKY TOOLBAR -->
<div class="mode-toggle bg">
  <strong style="font-size:.85rem; letter-spacing:.05em;">CONTRAST GRID</strong>
  <span style="font-size:.7rem; opacity:.5;">Lagunite — bg-* × color-*</span>
  <button class="toggle-btn" id="modeBtn" onclick="toggleMode()">☀ Light mode</button>
  <button class="toggle-btn" onclick="recompute()" style="opacity:.6;">↺ Recompute</button>
</div>

<div class="container padd-t">

  <!-- LEGEND -->
  <div class="legend">
    <span><span class="contrast-badge badge-aaa">AAA</span> ≥ 7:1 — perfect</span>
    <span><span class="contrast-badge badge-aa">AA</span> ≥ 4.5:1 — normal text ✓</span>
    <span><span class="contrast-badge badge-aa18">AA18</span> ≥ 3:1 — large text only</span>
    <span><span class="contrast-badge badge-fail">FAIL</span> &lt; 3:1 — avoid</span>
    <span><span class="contrast-badge badge-skip">—</span> gradient / skip</span>
  </div>

  <!-- ── SEMANTIC BACKGROUNDS ── -->
  <div class="section-title">Semantic Backgrounds</div>
  <div class="swatch-grid" id="semantic-grid"></div>

  <!-- ── GRADIENT BACKGROUNDS ── -->
  <div class="section-title">Gradient Backgrounds (bgg-*)</div>
  <div class="swatch-grid" id="gradient-grid"></div>

  <!-- ── PALETTE STRIPS ── -->
  <div class="section-title">Palette — Gray</div>
  <div class="palette-strip" id="pal-gray"></div>

  <div class="section-title">Palette — Blue</div>
  <div class="palette-strip" id="pal-blue"></div>

  <div class="section-title">Palette — Green</div>
  <div class="palette-strip" id="pal-green"></div>

  <div class="section-title">Palette — Yellow</div>
  <div class="palette-strip" id="pal-yellow"></div>

  <div class="section-title">Palette — Red</div>
  <div class="palette-strip" id="pal-red"></div>

</div>

<script>
// ── WCAG contrast engine ────────────────────────────────────────────────────
function sRGB(c) {
  c /= 255;
  return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function luminance(r, g, b) {
  return 0.2126 * sRGB(r) + 0.7152 * sRGB(g) + 0.0722 * sRGB(b);
}
function contrastRatio(l1, l2) {
  const [hi, lo] = l1 > l2 ? [l1, l2] : [l2, l1];
  return (hi + 0.05) / (lo + 0.05);
}
function parseColor(str) {
  if (!str) return null;
  const m = str.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : null;
}
function getBgColor(el) {
  // Walk up to find first non-transparent bg
  let node = el;
  while (node && node !== document.body.parentElement) {
    const bg = window.getComputedStyle(node).backgroundColor;
    const rgb = parseColor(bg);
    if (rgb && !(rgb[0] === 0 && rgb[1] === 0 && rgb[2] === 0 && bg.includes('rgba(0, 0, 0, 0)'))) {
      return rgb;
    }
    node = node.parentElement;
  }
  return [255, 255, 255];
}

function ratingBadge(ratio) {
  const r = ratio.toFixed(1);
  if (ratio >= 7)   return `<span class="contrast-badge badge-aaa">AAA ${r}</span>`;
  if (ratio >= 4.5) return `<span class="contrast-badge badge-aa">AA ${r}</span>`;
  if (ratio >= 3)   return `<span class="contrast-badge badge-aa18">AA18 ${r}</span>`;
  return `<span class="contrast-badge badge-fail">✗ ${r}</span>`;
}
function skipBadge() {
  return `<span class="contrast-badge badge-skip">—</span>`;
}

// ── Text probes ─────────────────────────────────────────────────────────────
const PROBES = [
  { label: '(default — auto)',   cls: '' },          // what bg-* sets on its own
  { label: 'color-text',         cls: 'color-text' },
  { label: 'color-text-alt',     cls: 'color-text-alt' },
  { label: 'color-almost-white', cls: 'color-almost-white' },
  { label: 'color-almost-black', cls: 'color-almost-black' },
  { label: 'color-primary',      cls: 'color-primary' },
  { label: 'color-error',        cls: 'color-error' },
];

// ── Build swatch card ────────────────────────────────────────────────────────
function makeSwatch(bgClass, label) {
  const div = document.createElement('div');
  div.className = `swatch ${bgClass}`;
  div.dataset.bg = bgClass;

  const name = document.createElement('div');
  name.className = 'swatch-name';
  name.textContent = `.${label || bgClass}`;
  div.appendChild(name);

  PROBES.forEach(p => {
    const row = document.createElement('div');
    row.className = `text-sample ${p.cls}`;
    row.innerHTML = `<span class="label">${p.label}</span><span class="badge-slot">${skipBadge()}</span>`;
    div.appendChild(row);
  });

  return div;
}

// ── Recompute all badges ─────────────────────────────────────────────────────
function recompute() {
  document.querySelectorAll('.swatch').forEach(swatch => {
    const bgRgb = getBgColor(swatch);
    if (!bgRgb) return;

    const bgStr = window.getComputedStyle(swatch).backgroundColor;
    // Gradient or transparent: skip
    const isGradient = !parseColor(bgStr);

    swatch.querySelectorAll('.text-sample').forEach(row => {
      const slot = row.querySelector('.badge-slot');
      if (!slot) return;
      if (isGradient) { slot.innerHTML = skipBadge(); return; }

      const textRgb = parseColor(window.getComputedStyle(row).color);
      if (!textRgb) { slot.innerHTML = skipBadge(); return; }

      const bgL  = luminance(...bgRgb);
      const txtL = luminance(...textRgb);
      const ratio = contrastRatio(bgL, txtL);
      slot.innerHTML = ratingBadge(ratio);
    });
  });

  // Palette swatches
  document.querySelectorAll('.palette-swatch').forEach(sw => {
    const bgRgb = parseColor(window.getComputedStyle(sw).backgroundColor);
    if (!bgRgb) return;
    const bgL = luminance(...bgRgb);

    const white = [255, 255, 255];
    const black = [0, 0, 0];
    const rW = contrastRatio(bgL, luminance(...white));
    const rB = contrastRatio(bgL, luminance(...black));

    const whiteEl = sw.querySelector('.ratio-wh');
    const blackEl = sw.querySelector('.ratio-bk');
    if (whiteEl) {
      whiteEl.textContent = `W ${rW.toFixed(1)}`;
      whiteEl.style.color = '#fff';
      whiteEl.style.opacity = rW >= 4.5 ? '1' : '0.3';
    }
    if (blackEl) {
      blackEl.textContent = `B ${rB.toFixed(1)}`;
      blackEl.style.color = '#000';
      blackEl.style.background = 'rgba(255,255,255,0.7)';
      blackEl.style.padding = '0 2px';
      blackEl.style.borderRadius = '2px';
      blackEl.style.opacity = rB >= 4.5 ? '1' : '0.3';
    }
  });
}

// ── Build semantic grid ──────────────────────────────────────────────────────
const SEMANTIC_BGS = [
  'bg', 'bg-alt',
  'bg-1', 'bg-2', 'bg-3', 'bg-4', 'bg-5', 'bg-6', 'bg-7', 'bg-8', 'bg-9',
  'bg-black', 'bg-ablack', 'bg-white', 'bg-awhite',
  'bg-success', 'bg-warning', 'bg-error',
];

const GRADIENT_BGS = [
  'bgg-1', 'bgg-2', 'bgg-3', 'bgg-4',
  'bgg-5', 'bgg-6', 'bgg-7', 'bgg-8',
  'bgg-success', 'bgg-lf-1', 'bgg-rg-1', 'bgg-t-1', 'bgg-b-1',
];

const PALETTE_STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
const PALETTE_FAMILIES = ['gray', 'blue', 'green', 'yellow', 'red'];

function buildSwatchGrid(containerID, classes) {
  const grid = document.getElementById(containerID);
  classes.forEach(bgCls => {
    grid.appendChild(makeSwatch(bgCls));
  });
}

function buildPaletteStrip(containerID, family) {
  const strip = document.getElementById(containerID);
  PALETTE_STEPS.forEach(step => {
    const div = document.createElement('div');
    div.className = `palette-swatch bg-${family}-${step}`;
    div.innerHTML = `
      <span class="step-label">${step}</span>
      <span class="ratio-wh">W —</span>
      <span class="ratio-bk">B —</span>
    `;
    strip.appendChild(div);
  });
}

// ── Toggle night mode ────────────────────────────────────────────────────────
function toggleMode() {
  const html = document.documentElement;
  const isNight = html.classList.toggle('night');
  document.getElementById('modeBtn').textContent = isNight ? '☀ Light mode' : '🌙 Dark mode';
  setTimeout(recompute, 50); // wait for CSS vars to settle
}

// ── Init ─────────────────────────────────────────────────────────────────────
buildSwatchGrid('semantic-grid', SEMANTIC_BGS);
buildSwatchGrid('gradient-grid', GRADIENT_BGS);
PALETTE_FAMILIES.forEach(fam => buildPaletteStrip(`pal-${fam}`, fam));

// Initial compute after paint
requestAnimationFrame(() => setTimeout(recompute, 100));
</script>
