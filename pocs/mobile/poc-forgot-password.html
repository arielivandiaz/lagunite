<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Mobile POC</title>
  <link rel="stylesheet" href="../../dist/lagunite.css">
  <style>
    /* GAP: .radio-divs label div uses border-radius-m — need rounded-xl full-width contact card variant */
    .radio-divs.contact-pick { flex-direction: column; width: 100%; }
    .radio-divs.contact-pick label {
      width: 100%;
      text-align: left;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .radio-divs.contact-pick label div {
      background: transparent;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .radio-divs.contact-pick label:hover {
      border-color: var(--color-primary);
    }
    .radio-divs.contact-pick label:hover div {
      box-shadow: none;
      transform: none;
    }
    .radio-divs.contact-pick input:checked + label {
      border-color: var(--color-primary);
      background: rgba(var(--color-primary-rgb), 0.06);
    }
    .radio-divs.contact-pick input:checked + label div {
      box-shadow: none;
      transform: none;
    }
    .contact-method { font-size: var(--font-size-xs); opacity: 0.6; }
    .contact-value { font-size: var(--font-size-s); font-weight: var(--font-weight-medium); }

    /* Illustration placeholder */
    .illustration {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(var(--color-primary-rgb), 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
  </style>
</head>
<body class="night bg marg-0">

<button class="color-primary icon pos-fixed top-0 right-0 marg-s z5" aria-label="Toggle theme" onclick="document.body.classList.toggle('night')">&#9790;</button>

<div class="wp100 dwp40 col jc-sb padd-v-l h-full-screen">

  <!-- Top bar: back arrow + title -->
  <div class="row wp100 ai-c gap-s padd-h-l">
    <a href="#" class="btn alt icon" aria-label="Go back">&#8592;</a>
    <h3 class="marg-0 font-bold">Forgot Password</h3>
  </div>

  <!-- Main content -->
  <div class="col ai-c gap-l wp90 flex-1 jc-c">

    <!-- Illustration -->
    <div class="illustration color-primary">&#128274;</div>

    <p class="font-s opacity-70 ta-c marg-0" style="max-width: 280px">
      Select which contact details should we use to reset your password
    </p>

    <!-- Contact method options -->
    <div class="radio-divs contact-pick">

      <div>
        <input type="radio" name="contact" id="sms" value="sms" checked>
        <label for="sms">
          <div>
            <span class="contact-method">via SMS:</span>
            <span class="contact-value">+1 85 ****** 90</span>
          </div>
        </label>
      </div>

      <div>
        <input type="radio" name="contact" id="email" value="email">
        <label for="email">
          <div>
            <span class="contact-method">via Email:</span>
            <span class="contact-value">eml****ey@yourdomain.com</span>
          </div>
        </label>
      </div>

    </div>

  </div>

  <!-- Footer: Continue -->
  <div class="row gap-s padd-h-l wp100">
    <button class="btn primary border-r-full flex-1 size-l" type="button">Continue</button>
  </div>

</div>

</body>
</html>
