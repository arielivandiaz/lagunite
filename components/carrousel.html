<!doctype html>
<html>

<head>
    <title>Lagunite</title>
    <!-- META -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="icon" type="image/png" href="../web/img/lagunite_iso_mini.png">


    <link type="text/css" rel="stylesheet" href="../src/lagunite-config.css" />
    <link type="text/css" rel="stylesheet" href="../src/lagunite.css" />




</head>


<body>
    
    <header class="marg-v-s ">
        <a href="/">
            <img src="../web/img/lagunite.png" class="maxw7">
        </a>
        <h3>Images Carrousel</h3>
    </header>

    <main>
  
        <section>
            <div class="carrousel vh50 vw80 centered" id="carrousel">
            </div>
        </section>

    </main>


    <footer class="row  vh20">
        <a href="https://github.com/arielivandiaz/lagunite">
            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Logo.png" style="width: 100px">
        </a>
    </footer>
    <script type="text/javascript" src="carrousel.js"></script>
    <script>
        var gallery = new Carrousel({
            id: 'carrousel',
            imgs: ['img/pexels-photo-1181243.jpeg',
                'img/pexels-photo-3861958.jpeg',
                'img/pexels-photo-4050296.jpeg',
                'img/pexels-photo-5668868.jpeg'
            ],
            arrows: true, //default: false
            points: true, //default: false
            classIn: 'img-in', //default: img-in
            classOut: 'img-out', //default: img-out
            modal: true, //default: false
            time: 2500 //default: 1
        });
        gallery.start();
    </script>

</body></html>
